<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' https: data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; script-src 'self'; connect-src 'self'">
  <title>Launcher</title>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <header class="titlebar">
      <div class="titlebar-brand">
        <span class="brand-mark" id="brand-mark"></span>
        <span class="brand-name" id="brand-name">Launcher</span>
      </div>
      <div class="titlebar-drag"></div>
      <div class="window-controls">
        <button class="wc" data-wc="minimize" title="Свернуть"><svg viewBox="0 0 12 12"><path d="M2 6h8"/></svg></button>
        <button class="wc" data-wc="maximize" title="Развернуть"><svg viewBox="0 0 12 12"><rect x="2.5" y="2.5" width="7" height="7"/></svg></button>
        <button class="wc wc-close" data-wc="close" title="Закрыть"><svg viewBox="0 0 12 12"><path d="M3 3l6 6M9 3l-6 6"/></svg></button>
      </div>
    </header>

    <aside class="sidebar">
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-bottom">
        <div class="links" id="links"></div>
        <button class="account-chip" id="account-chip"></button>
      </div>
    </aside>

    <main class="content" id="content"></main>

    <footer class="taskbar" id="taskbar" hidden>
      <div class="task-text" id="task-text"></div>
      <div class="task-bar"><div class="task-fill" id="task-fill"></div></div>
      <div class="task-meta" id="task-meta"></div>
      <button class="task-link" id="task-open">Загрузки</button>
    </footer>
  </div>

  <div id="modal-root"></div>
  <div id="toasts"></div>

  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
  <script src="js/pages/home.js"></script>
  <script src="js/pages/instances.js"></script>
  <script src="js/pages/instance-editor.js"></script>
  <script src="js/pages/catalog.js"></script>
  <script src="js/pages/downloads.js"></script>
  <script src="js/pages/defaults.js"></script>
  <script src="js/pages/accounts.js"></script>
  <script src="js/pages/settings.js"></script>
  <script src="js/pages/console.js"></script>
  <script src="js/boot.js"></script>
</body>
</html>
